name: SkillBridge AI — CI

on:
  push:
    branches: ["main", "dev"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    name: Run test suite (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint with flake8
        run: |
          pip install flake8
          # Stop the build on syntax errors or undefined names; warn on style issues
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-line-length=120 --statistics

      - name: Phase 1 tests
        run: python tests/test_phase1.py
        env:
          FLASK_ENV: testing
          SECRET_KEY: ci-test-key

      - name: Phase 2 tests
        run: python tests/test_phase2.py
        env:
          FLASK_ENV: testing
          SECRET_KEY: ci-test-key

      - name: Phase 3 tests
        run: python tests/test_phase3.py
        env:
          FLASK_ENV: testing
          SECRET_KEY: ci-test-key

      - name: Phase 4 — ai_client unit tests
        run: python -m unittest tests/test_step1_ai_client.py -v
        env:
          FLASK_ENV: testing
          SECRET_KEY: ci-test-key

      - name: Phase 4 — integration tests
        run: python tests/test_phase4.py
        env:
          FLASK_ENV: testing
          SECRET_KEY: ci-test-key
          # No WATSONX_* vars → all AI calls fall back gracefully
