{% extends "base.html" %}
{% block title %}Create account | SkillBridge AI{% endblock %}
{% block content %}
<div style="max-width:440px;margin:48px auto">
  <div class="card">
    <p class="eyebrow" style="margin-bottom:6px">GET STARTED</p>
    <h2 style="margin-top:0">Create your account</h2>
    <p class="muted" style="margin-bottom:20px">Track your applications and get personalised guidance.</p>

    <form method="post" action="/register" novalidate>
      <div class="form-group" style="margin-bottom:12px">
        <label for="display_name">Your name</label>
        <input id="display_name" name="display_name" type="text"
               placeholder="Ravi Kumar" required maxlength="100"
               value="{{ request.form.get('display_name', '') }}">
      </div>
      <div class="form-group" style="margin-bottom:12px">
        <label for="email">Email address</label>
        <input id="email" name="email" type="email"
               placeholder="you@example.com" required maxlength="200"
               value="{{ request.form.get('email', '') }}">
      </div>
      <div class="form-group" style="margin-bottom:12px">
        <label for="password">Password</label>
        <input id="password" name="password" type="password"
       placeholder="At least 8 characters" required minlength="8">

<small style="color:var(--muted);">
    Minimum 8 characters
</small>
      </div>
      <div class="form-group" style="margin-bottom:16px">
        <label for="confirm_password">Confirm password</label>
        <input id="confirm_password" name="confirm_password" type="password"
               placeholder="Repeat password" required minlength="8">
      </div>
      <div style="display:flex;align-items:flex-start;gap:10px;margin-bottom:18px">
        <input type="checkbox" id="consent" name="consent" value="1"
               required style="width:auto;margin-top:3px;flex-shrink:0"
               aria-required="true">
        <label for="consent" style="color:var(--ink);font-weight:400;font-size:13px;line-height:1.5">
          I have read and agree to the
          <a href="/privacy" target="_blank">Privacy Notice</a>.
          I understand that resume files are processed locally and that job listings are fictional demo data.
        </label>
      </div>
      <button class="button" type="submit" style="width:100%;justify-content:center;margin-top:0">
        Create account
      </button>
    </form>

    <p style="text-align:center;margin-top:16px;font-size:13px;color:var(--muted)">
      Already have an account? <a href="/login">Log in</a>
    </p>
  </div>
</div>
{% endblock %}
